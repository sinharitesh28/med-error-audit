<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <style>
        .dashboard-container { padding: 20px; max-width: 98vw; margin: 0 auto; }
        .table-wrapper { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; max-height: 70vh; overflow-y: auto;}
        table { width: max-content; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 15px; border: 1px solid #e0e0e0; text-align: left; white-space: nowrap; }
        th { background: var(--secondary); color: white; position: sticky; top: 0; z-index: 10; }
        .severity-0 { background-color: #e8f5e9; color: #2e7d32; font-weight: bold; text-align: center;}
        .severity-na { background-color: #f5f5f5; color: #9e9e9e; font-style: italic; text-align: center;}
        .severity-err { background-color: #ffebee; color: #c62828; font-weight: bold; text-align: center;}
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-container" style="position:relative; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h1 style="color:var(--tertiary); margin:0;">Faculty Analytics Dashboard</h1>
                <p style="margin:5px 0 0 0; color:#666;">Automated Medication Error DataSheet</p>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="exportToCSV()">Ã°Å¸â€œÂ¥ Download CSV</button>
                <button class="btn" style="background:#f44336; color:white;" onclick="logout()">Logout</button>
            </div>
        </div>

        
        <div style="background:#f8f9fa; padding:15px; border-radius:6px; margin-top:20px; display:flex; gap:15px; align-items:center;">
            <strong>Filter by Audit Date:</strong>
            <label>From: <input type="date" id="filter-from" onchange="filterData()"></label>
            <label>To: <input type="date" id="filter-to" onchange="filterData()"></label>
            <button class="btn btn-secondary" style="padding:5px 10px;" onclick="document.getElementById('filter-from').value=''; document.getElementById('filter-to').value=''; filterData();">Clear</button>
        </div>

        <div class="table-wrapper">
            <table id="datasheetTable">
                <thead id="ds-head"><tr><th>Loading Data...</th></tr></thead>
                <tbody id="ds-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let globalData = [];
        async function loadData() {
            try {
                const res = await fetch('/api/audit/datasheet');
                const json = await res.json();
                if(json.status === 'success') {
                    globalData = json.data;
                    renderTable(globalData);
                }
            } catch(e) { alert("Failed to load datasheet: " + e.message); }
        }

        
        function filterData() {
            const fromDate = document.getElementById('filter-from').value;
            const toDate = document.getElementById('filter-to').value;

            const filtered = globalData.filter(row => {
                const rowDateStr = row['Audit TimeStamp'];
                if(!rowDateStr) return true;

                const rowDate = rowDateStr.split(' ')[0]; // Extract YYYY-MM-DD

                if(fromDate && rowDate < fromDate) return false;
                if(toDate && rowDate > toDate) return false;
                return true;
            });
            renderTable(filtered);
        }

        function renderTable(data) {
            if(data.length === 0) {
                document.getElementById('ds-head').innerHTML = '<tr><th>No Audit Data Found</th></tr>';
                return;
            }

            const cols = Object.keys(data[0]);

            // Render Multi-Row Headers
            const sectionMap = {
                'Patient Info': ['Audit TimeStamp', 'Auditor Name', 'Encounter', 'Patient Name', 'Department', 'UHID', 'Admission Date', 'Age/Gender', 'Consultant', 'Diagnosis', 'Transcribed?', 'Chart Image'],
                'Drug Info': ['Drug Name', 'Dose', 'Route', 'Frequency'],
                'Prescription Errors': ['Rx: Inappropriate selection', 'Rx: CAPITAL LETTERS', 'Rx: Illegible', 'Rx: Abbreviations', 'Rx: Generic name', 'Rx: Wrong Dose', 'Rx: Wrong Route', 'Rx: IV Incompat.', 'Rx Remarks', 'Rx Evidence'],
                'Transcription Errors': ['Tx: Wrong drug', 'Tx: Wrong route', 'Tx Remarks', 'Tx Evidence'],
                'Dispensing Errors': ['Disp: Wrong drug', 'Disp: Expired', 'Disp Remarks', 'Disp Evidence'],
                'Administration Errors': ['Admin: Omission', 'Admin: Wrong patient', 'Admin Remarks', 'Admin Evidence']
            };

            let headHtml = '<tr>';
            let subHeadHtml = '<tr>';

            Object.keys(sectionMap).forEach(sec => {
                let count = 0;
                sectionMap[sec].forEach(c => { if(cols.includes(c)) count++; });

                if(count > 0) {
                    headHtml += `<th colspan="${count}" style="text-align:center; background:#1976d2; color:white; border-bottom:1px solid #90caf9;">${sec}</th>`;
                }

                sectionMap[sec].forEach(c => {
                    if(cols.includes(c)) subHeadHtml += `<th>${c}</th>`;
                });
            });

            // Map any unhandled columns just in case
            const mappedCols = Object.values(sectionMap).flat();
            const unmapped = cols.filter(c => !mappedCols.includes(c));
            if (unmapped.length > 0) {
                headHtml += `<th colspan="${unmapped.length}" style="text-align:center; background:#546e7a; color:white;">Other Info</th>`;
                unmapped.forEach(c => subHeadHtml += `<th>${c}</th>`);
            }

            headHtml += '</tr>' + subHeadHtml + '</tr>';
            document.getElementById('ds-head').innerHTML = headHtml;

            // Render Body
            let bodyHtml = '';
            data.forEach(row => {
                bodyHtml += '<tr>';
                cols.forEach(c => {
                    let val = row[c] || '';
                    let cssClass = '';

                    if(val === '0') cssClass = 'severity-0';
                    else if(val === 'NA') cssClass = 'severity-na';
                    else if(['A','B','C','D','E','F','G','H','I'].includes(val)) cssClass = 'severity-err';

                    if(String(val).startsWith('http')) {
                        val = `<a href="${val}" target="_blank" style="color:blue;">View Evidence</a>`;
                    }

                    bodyHtml += `<td class="${cssClass}">${val}</td>`;
                });
                bodyHtml += '</tr>';
            });
            document.getElementById('ds-body').innerHTML = bodyHtml;
        }

        function exportToCSV() {
            if(globalData.length === 0) return;
            const cols = Object.keys(globalData[0]);
            let csv = cols.join(',') + '\n';

            globalData.forEach(row => {
                let r = cols.map(c => {
                    let val = String(row[c] || '').replace(/"/g, '""');
                    return `"${val}"`;
                });
                csv += r.join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Medication_Audit_Export_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Run on load
        loadData();
    </script>
</body>
</html>
