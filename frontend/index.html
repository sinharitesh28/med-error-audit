<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Error Audit DCF</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="container">
        
        </div>
        
        <div class="header-container" style="position:relative;">
            <button onclick="logout()" style="position:absolute; right:20px; top:20px; background:#f44336; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Logout</button>
            <img src="images/Parul_University_Logo.webp" alt="Parul University Logo" class="header-logo">
            <svg viewBox="0 0 600 80" class="header-wordart">
                <defs>
                    <linearGradient id="gradTitle" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--tertiary);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--secondary);stop-opacity:1" />
                    </linearGradient>
                </defs>
                <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-size="34" font-weight="900" fill="url(#gradTitle)" font-family="Arial, sans-serif">MEDICATION ERROR AUDIT</text>
                <text x="50%" y="80%" dominant-baseline="middle" text-anchor="middle" font-size="16" font-weight="normal" fill="var(--quaternary)" font-family="Arial, sans-serif" letter-spacing="2">DATA COLLECTION FORM</text>
            </svg>
        </div>
<form id="auditForm" onsubmit="submitForm(event)">
    <!-- Global Datalists for Editable Dropdowns -->
    <datalist id="route-datalist">
        <option value="Oral (PO)"></option>
        <option value="Intravenous (IV)"></option>
        <option value="Intramuscular (IM)"></option>
        <option value="Subcutaneous (SC)"></option>
        <option value="Sublingual (SL)"></option>
        <option value="Topical"></option>
        <option value="Inhalation"></option>
        <option value="Ophthalmic"></option>
        <option value="Otic"></option>
        <option value="Rectal"></option>
        <option value="Vaginal"></option>
        <option value="Nasal"></option>
    </datalist>


            <div class="card" id="patient-section">
                <h2>Section 1: Patient Details</h2>
                
                <div style="display:flex; gap:15px;">
                    <div class="form-group" style="flex:1;"><label>Patient UHID *</label><input type="text" id="p-uhid" required></div>
                    <div class="form-group" style="flex:1;"><label>Patient Name</label><input type="text" id="p-name"></div>
                    <div class="form-group" style="flex:1;">
                        <label>Date of Admission</label>
                        <input type="date" id="p-doa">
                    </div>
                </div>


                <div style="display:flex; gap:15px;">
                    <div class="form-group" style="flex:1;">
                        <label>Department / Ward</label>
                        <select id="p-dept">
                            <option value="">Select Department</option>
                            <option value="Pediatric">Pediatric</option><option value="General Medicine Male">General Medicine Male</option>
                            <option value="General Medicine Female">General Medicine Female</option><option value="Psychiatric">Psychiatric</option>
                            <option value="Surgery Male">Surgery Male</option><option value="Skin and VD">Skin and VD</option>
                            <option value="Main ICU">Main ICU</option><option value="Orthopedic Male">Orthopedic Male</option>
                            <option value="Super Specialty Male">Super Specialty Male</option><option value="Surgery Female">Surgery Female</option>
                            <option value="Super Specialty Female">Super Specialty Female</option><option value="Gynecology and Obg">Gynecology and Obg</option>
                            <option value="Orthopedic Female">Orthopedic Female</option><option value="NICU (Neuro)">NICU (Neuro)</option>
                            <option value="CICU">CICU</option>
                        </select>
                    </div>

                    <div class="form-group" style="flex:1;">
                        <label>Age & Unit</label>
                        <div style="display:flex; gap:5px;">
                            <input type="number" id="p-age" placeholder="Age" style="flex:2;">
                            <select id="p-age-unit" style="flex:1;">
                                <option value="Years" selected>Years</option>
                                <option value="Months">Months</option>
                                <option value="Days">Days</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="flex:1;">
                        <label>Gender</label>
                        <select id="p-gender">
                            <option value="">Select</option>
                            <option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="clinical-field-wrapper form-group">
                    <label>Diagnoses (Select multiple via Search)</label>
                    <input type="text" id="diagnosis-display" placeholder="Search conditions (e.g., 'diabetes')..." autocomplete="off">
                    <ul id="diagnosis-results" class="autocomplete-dropdown" style="display:none;"></ul>
                    <div id="diagnosis-pills" class="pills-container"></div>
                </div>
                <div class="form-group" style="margin-top:15px; background: #e3f2fd; padding: 15px; border-radius: 6px; border: 1px dashed #2196f3;">
                    <label>Upload Treatment Chart Image &#128247;</label>
                    <input type="file" id="p-chart-file" accept="image/*" capture="environment">
                </div>
            </div>

            <h2>Section 2: Medication Details</h2>
            <div id="drugs-container"></div>
            <button type="button" class="btn btn-secondary" onclick="addDrug()">+ Add Drug</button>
            <button type="submit" class="btn btn-submit">Submit Audit Form</button>
        </form>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
